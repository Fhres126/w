<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Veluil Dictionary</title>

<style>

:root{
    --bg:#000000;
    --card:#181818;
    --text:#ffffff;
    --sub:#aaaaaa;
    --border:#333333;
    --accent:#ff5533;
}

*{
    box-sizing:border-box;
}

html{
    font-size:18px;
}

body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:sans-serif;
}

header{
    padding:20px;
    position:sticky;
    top:0;
    z-index:100;
    background:#000000ee;
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
}

h1{
    margin:0;
    font-size:1.6rem;
}

.subtitle{
    color:var(--sub);
    font-size:.8rem;
    margin-top:5px;
}


/* SEARCH */

.searchBox{
    margin-top:15px;
}

.searchTitle{
    font-size:.85rem;
    color:var(--sub);
    margin-bottom:5px;
}

.searchRow{
    display:flex;
    gap:7px;
}

input{
    flex:1;
    min-width:0;

    background:#111111;
    color:white;

    border:1px solid #555;
    border-radius:7px;

    padding:10px;
    font-size:1rem;
}

button{
    background:#222222;
    color:white;

    border:1px solid #555;
    border-radius:7px;

    padding:9px 13px;

    cursor:pointer;
}

button:hover{
    background:#333333;
}


/* NAV */

nav{
    display:flex;
    gap:7px;

    overflow-x:auto;

    padding:10px 15px;

    border-bottom:1px solid var(--border);
}

nav button{
    white-space:nowrap;
}


/* MAIN */

main{
    max-width:900px;
    margin:auto;

    padding:15px;
}

.count{
    color:var(--sub);
    margin-bottom:10px;
}


/* ENTRY */

.entry{
    background:var(--card);

    border:1px solid var(--border);
    border-radius:9px;

    padding:13px;

    margin-bottom:9px;
}

.word{
    color:var(--accent);

    font-size:1.25rem;
    font-weight:bold;
}

.meaning{
    margin-top:5px;
}

.source{
    margin-top:8px;

    color:#999999;

    font-family:monospace;
    font-size:.8rem;

    white-space:pre-wrap;
    word-break:break-word;
}


/* ALPHABET */

.alphabet{
    display:flex;
    flex-wrap:wrap;
    gap:5px;

    margin-bottom:15px;
}

.alphabet button{
    padding:7px 10px;
}


/* RANDOM */

.randomCard{
    background:var(--card);

    border:1px solid var(--border);
    border-radius:9px;

    padding:20px;

    text-align:center;
}

.randomCard .word{
    font-size:2rem;
}


/* ABOUT */

.card{
    background:var(--card);

    border:1px solid var(--border);
    border-radius:9px;

    padding:15px;

    margin-bottom:10px;
}

.card h2{
    margin-top:0;
}

a{
    color:#ff8066;
}


/* OTHER */

.hidden{
    display:none;
}

.empty{
    color:var(--sub);
    padding:30px 0;
    text-align:center;
}

</style>

</head>


<body>


<header>

<h1>Veluil Dictionary</h1>

<div class="subtitle">
English ↔ Veluil
</div>


<!-- VELUIL SEARCH -->

<div class="searchBox">

<div class="searchTitle">
Search Veluil
</div>

<div class="searchRow">

<input
    id="veluilInput"
    type="text"
    placeholder="Veluil word..."
    autocomplete="off"
>

<button onclick="searchVeluil()">
Search
</button>

</div>

</div>


<!-- ENGLISH SEARCH -->

<div class="searchBox">

<div class="searchTitle">
Search English
</div>

<div class="searchRow">

<input
    id="englishInput"
    type="text"
    placeholder="English meaning..."
    autocomplete="off"
>

<button onclick="searchEnglish()">
Search
</button>

</div>

</div>

</header>



<nav>

<button onclick="showPage('dictionary')">
Dictionary
</button>

<button onclick="showPage('random')">
Random
</button>

<button onclick="showPage('alphabet')">
Alphabetical
</button>

<button onclick="showPage('about')">
About
</button>

</nav>



<main>


<!-- DICTIONARY -->

<section id="dictionaryPage">

<div
    id="count"
    class="count"
>
Loading dictionary...
</div>

<div id="results"></div>

</section>



<!-- RANDOM -->

<section
    id="randomPage"
    class="hidden"
>

<div class="randomCard">

<div id="randomResult"></div>

<br>

<button onclick="randomWord()">
Another word
</button>

</div>

</section>



<!-- ALPHABET -->

<section
    id="alphabetPage"
    class="hidden"
>

<div
    id="alphabet"
    class="alphabet"
></div>

<div id="alphabetResults"></div>

</section>



<!-- ABOUT -->

<section
    id="aboutPage"
    class="hidden"
>

<div class="card">

<h2>
About
</h2>

<p>
Veluil Dictionary
</p>

<p>
The dictionary is based on the Veluil vocabulary
and uses a structure inspired by the Globasa Menalari dictionary.
</p>

<p>
Veluil vocabulary source:
</p>

<a
href="https://raw.githubusercontent.com/Fhres126/w/main/co.txt"
target="_blank"
>
co.txt
</a>

<p>
Globasa reference:
</p>

<a
href="https://menalari.globasa.net/eng/"
target="_blank"
>
Menalari
</a>

</div>

</section>


</main>



<script>


/* =========================================
   SOURCE
========================================= */

const SOURCE =
"https://raw.githubusercontent.com/Fhres126/w/main/co.txt";


let entries = [];



/* =========================================
   LOAD DICTIONARY
========================================= */

fetch(SOURCE)

.then(function(response){

    if(!response.ok){

        throw new Error(
            "Could not load dictionary."
        );

    }

    return response.text();

})

.then(function(text){

    entries =
        parseDictionary(text);

    document
        .getElementById("count")
        .textContent =
        entries.length +
        " entries";

    render(
        entries.slice(0,100)
    );

    createAlphabet();

})

.catch(function(error){

    document
        .getElementById("count")
        .textContent =
        "Dictionary loading failed.";

    document
        .getElementById("results")
        .innerHTML =
        '<div class="empty">' +
        escapeHTML(error.message) +
        '</div>';

});



/* =========================================
   PARSE
========================================= */

function parseDictionary(text){

    let result = [];

    let lines =
        text.split(/\r?\n/);


    for(let raw of lines){

        let line =
            raw.trim();


        if(!line)
            continue;


        if(!line.includes("="))
            continue;


        if(
            line.startsWith("//") ||
            line.startsWith("▶")
        )
            continue;


        let equal =
            line.indexOf("=");


        let left =
            line
            .substring(0,equal)
            .trim();


        let right =
            line
            .substring(equal + 1)
            .trim();


        left =
            left.replace(
                /^-+/,
                ""
            )
            .trim();


        if(!left)
            continue;


        /*
         First token is treated
         as the Veluil word.
        */

        let word =
            left
            .split(/\s+/)[0]
            .trim();


        if(
            !/^[A-Za-z][A-Za-z0-9-]*$/
            .test(word)
        )
            continue;


        /*
         English gloss.

         Everything before //
         is treated as the meaning.
        */

        let meaning =
            right
            .split("//")[0]
            .trim();


        meaning =
            meaning.replace(
                /\s+/g,
                " "
            );


        if(!meaning)
            continue;


        result.push({

            word:word,

            meaning:meaning,

            raw:line

        });

    }


    /*
    Remove duplicate lines.
    */

    let seen =
        new Set();


    result =
        result.filter(function(x){

            if(
                seen.has(x.raw)
            )
                return false;


            seen.add(x.raw);

            return true;

        });


    return result;

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,

        function(char){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            };

            return map[char];

        }
    );

}



/* =========================================
   RENDER
========================================= */

function render(
    list,
    target="results"
){

    const element =
        document.getElementById(target);


    if(!list.length){

        element.innerHTML =
            '<div class="empty">' +
            'No result.' +
            '</div>';

        return;

    }


    element.innerHTML =
        list.map(function(x){

            return `

            <div class="entry">

                <div class="word">
                    ${escapeHTML(x.word)}
                </div>

                <div class="meaning">
                    ${escapeHTML(x.meaning)}
                </div>

                <div class="source">
                    ${escapeHTML(x.raw)}
                </div>

            </div>

            `;

        }).join("");

}



/* =========================================
   SEARCH VELUIL
========================================= */

function searchVeluil(){

    let query =
        document
        .getElementById("veluilInput")
        .value
        .trim()
        .toLowerCase();


    showPage("dictionary");


    if(!query){

        document
        .getElementById("count")
        .textContent =
        entries.length +
        " entries";

        render(
            entries.slice(0,100)
        );

        return;

    }


    /*
    IMPORTANT:

    Veluil search searches ONLY
    the Veluil word.
    */

    let result =
        entries.filter(function(x){

            return x.word
                .toLowerCase()
                .startsWith(query);

        });


    document
        .getElementById("count")
        .textContent =
        result.length +
        " result" +
        (
            result.length === 1
            ? ""
            : "s"
        );


    render(result);

}



/* =========================================
   SEARCH ENGLISH
========================================= */

function searchEnglish(){

    let query =
        document
        .getElementById("englishInput")
        .value
        .trim()
        .toLowerCase();


    showPage("dictionary");


    if(!query){

        document
        .getElementById("count")
        .textContent =
        entries.length +
        " entries";

        render(
            entries.slice(0,100)
        );

        return;

    }


    /*
    IMPORTANT:

    English search searches ONLY
    the English meaning.
    */

    let result =
        entries.filter(function(x){

            return x.meaning
                .toLowerCase()
                .includes(query);

        });


    document
        .getElementById("count")
        .textContent =
        result.length +
        " result" +
        (
            result.length === 1
            ? ""
            : "s"
        );


    render(result);

}



/* =========================================
   RANDOM WORD
========================================= */

function randomWord(){

    if(!entries.length)
        return;


    let item =
        entries[
            Math.floor(
                Math.random() *
                entries.length
            )
        ];


    render(
        [item],
        "randomResult"
    );

}



/* =========================================
   ALPHABET
========================================= */

function createAlphabet(){

    const letters =
        "abcdefghijklmnopqrstuvwxyz"
        .split("");


    document
        .getElementById("alphabet")
        .innerHTML =

        letters.map(function(letter){

            return `

            <button
                onclick="alphabetSearch('${letter}')"
            >
                ${letter}
            </button>

            `;

        }).join("");

}


function alphabetSearch(letter){

    let result =
        entries.filter(function(x){

            return x.word
                .toLowerCase()
                .startsWith(letter);

        });


    render(
        result,
        "alphabetResults"
    );

}



/* =========================================
   PAGE NAVIGATION
========================================= */

function showPage(page){

    document
        .getElementById("dictionaryPage")
        .classList
        .toggle(
            "hidden",
            page !== "dictionary"
        );


    document
        .getElementById("randomPage")
        .classList
        .toggle(
            "hidden",
            page !== "random"
        );


    document
        .getElementById("alphabetPage")
        .classList
        .toggle(
            "hidden",
            page !== "alphabet"
        );


    document
        .getElementById("aboutPage")
        .classList
        .toggle(
            "hidden",
            page !== "about"
        );


    if(page === "random"){

        randomWord();

    }

}



/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("veluilInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter")
                searchVeluil();

        }
    );


document
    .getElementById("englishInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter")
                searchEnglish();

        }
    );


</script>

</body>
</html>
