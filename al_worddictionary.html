<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>samin Dictionary</title>

<style>

:root{
    --bg:#000;
    --card:#151515;
    --card2:#1d1d1d;
    --text:#fff;
    --sub:#999;
    --border:#333;
    --accent:#ff5733;
    --green:#55d66b;
    --blue:#4db8ff;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    /* 동적 뷰포트 높이(dvh)로 설정하여 키보드 영역을 제외한 실제 화면 크기에 맞춤 */
    height:100dvh;
    min-height:100dvh;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow-x:hidden;
    overflow-y:auto;
    /* 스크롤 끝에서 바운스되며 하단 빈 공간이 드러나는 현상 방지 */
    overscroll-behavior-y:none;
}


/* =========================
   HEADER
========================= */

header{
    width:100%;
    padding:18px 16px 14px;

    background:#000;

    border-bottom:1px solid var(--border);
}

h1{
    margin:0;

    font-size:1.65rem;
    line-height:1.2;
}

.subtitle{
    margin-top:4px;

    color:var(--sub);

    font-size:.8rem;
}


/* =========================
   SEARCH
========================= */

.searchBox{
    width:100%;
    margin-top:13px;
}

.modeGroup{
    display:flex;
    gap:6px;
    margin-bottom:8px;
}

.modeBtn{
    padding:6px 12px;
    background:#161616;
    color:var(--sub);
    border:1px solid #444;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    transition:all 0.15s ease;
}

.modeBtn:hover{
    background:#222;
    color:#fff;
}

.modeBtn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
    font-weight:bold;
}

.searchRow{
    display:flex;
    width:100%;
}

.searchRow input{
    width:100%;
    padding:11px 13px;

    background:#101010;
    color:white;

    border:1px solid #555;
    border-radius:8px;

    font-size:16px;

    outline:none;
}

.searchRow input:focus{
    border-color:var(--accent);
}


/* =========================
   BUTTON
========================= */

button{
    padding:9px 13px;

    background:#222;
    color:#fff;

    border:1px solid #555;
    border-radius:7px;

    font-size:15px;

    cursor:pointer;
}

button:hover{
    background:#303030;
}

button:active{
    background:#444;
}


/* =========================
   NAV
========================= */

nav{
    width:100%;

    display:flex;
    gap:7px;

    padding:9px 15px;

    overflow-x:auto;
    overflow-y:hidden;

    border-bottom:1px solid var(--border);

    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav button{
    flex:none;
    white-space:nowrap;
}


/* =========================
   MAIN
========================= */

main{
    width:100%;
    max-width:950px;

    margin:auto;

    padding:14px 15px 50px;
}

.count{
    margin-bottom:11px;

    color:var(--sub);

    font-size:.9rem;
}


/* =========================
   DICTIONARY ENTRY
========================= */

.entry{
    width:100%;

    margin-bottom:9px;
    padding:13px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:9px;

    overflow:hidden;
}

.entryWord{
    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:7px;
}

.word{
    color:var(--accent);

    font-size:1.3rem;
    font-weight:700;

    word-break:break-word;
}

.type{
    padding:2px 6px;

    color:#111;
    background:#ddd;

    border-radius:5px;

    font-size:.7rem;
    font-weight:bold;
}

.meaning{
    margin-top:5px;

    font-size:1rem;

    overflow-wrap:anywhere;
}

.comment{
    margin-top:4px;
    color:var(--sub);
    font-size:.85rem;
}

.source{
    margin-top:9px;

    padding-top:7px;

    color:#777;

    border-top:1px solid #292929;

    font-family:monospace;
    font-size:.75rem;

    white-space:normal;
    word-break:break-all;
    overflow-wrap:anywhere;
}


/* =========================
   CATEGORY
========================= */

.category{
    margin:20px 0 8px;

    padding:8px 10px;

    background:var(--card2);

    border-left:3px solid var(--accent);

    border-radius:5px;

    font-weight:bold;
}


/* =========================
   RANDOM
========================= */

.randomCard{
    width:100%;

    padding:25px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:10px;

    text-align:center;
}

.randomCard .word{
    font-size:2rem;
}

.randomMeaning{
    margin-top:8px;

    font-size:1.1rem;
}


/* =========================
   ALPHABET
========================= */

.alphabet{
    display:flex;

    flex-wrap:wrap;

    gap:5px;

    margin-bottom:15px;
}

.alphabet button{
    min-width:38px;
    padding:7px 9px;
}


/* =========================
   ABOUT
========================= */

.card{
    width:100%;

    padding:16px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:9px;
}

.card h2{
    margin-top:0;
}

a{
    color:#ff8066;
}


/* =========================
   EMPTY
========================= */

.empty{
    padding:35px 0;

    color:var(--sub);

    text-align:center;
}


/* =========================
   HIDDEN
========================= */

.hidden{
    display:none !important;
}


/* =========================
   LANDSCAPE
========================= */

@media (orientation:landscape){

    header{
        padding:
            10px
            15px
            10px;
    }

    h1{
        font-size:1.35rem;
    }

    .subtitle{
        font-size:.72rem;
    }

    .searchBox{
        margin-top:7px;
    }

    .searchRow input{
        padding:8px;
    }

    nav{
        padding:7px 15px;
    }

    main{
        padding-top:10px;
    }

}


/* =========================
   SHORT LANDSCAPE
========================= */

@media (
    orientation:landscape
) and (
    max-height:500px
){

    header{
        padding:7px 12px;
    }

    h1{
        font-size:1.15rem;
    }

    .subtitle{
        display:none;
    }

    .searchBox{
        margin-top:5px;
    }

    .searchRow input{
        padding:7px 9px;
    }

    nav{
        padding:5px 12px;
    }

    main{
        padding:
            8px 12px 30px;
    }

}


/* =========================
   DESKTOP
========================= */

@media (min-width:700px){

    header{
        padding-left:25px;
        padding-right:25px;
    }

    nav{
        padding-left:25px;
        padding-right:25px;
    }

    main{
        padding-left:25px;
        padding-right:25px;
    }

}

</style>

</head>


<body>


<header>

<h1>
samin Dictionary
</h1>

<div class="subtitle">
samin ↔ English / Korean
</div>


<!-- =====================
     UNIFIED SEARCH
====================== -->

<div class="searchBox">

<div class="modeGroup">
    <button type="button" class="modeBtn active" onclick="setSearchMode('auto', this)">Auto</button>
    <button type="button" class="modeBtn" onclick="setSearchMode('samin', this)">samin</button>
    <button type="button" class="modeBtn" onclick="setSearchMode('english', this)">English</button>
</div>

<div class="searchRow">

<input
    id="searchInput"
    type="text"
    placeholder="Type any word, meaning, or tag..."
    autocomplete="off"
>

</div>

</div>

</header>



<!-- =====================
     NAV
====================== -->

<nav>

<button
    type="button"
    onclick="showPage('dictionary')"
>
Dictionary
</button>

<button
    type="button"
    onclick="showPage('random')"
>
Random
</button>

<button
    type="button"
    onclick="showPage('alphabet')"
>
Alphabetical
</button>

<button
    type="button"
    onclick="showPage('about')"
>
About
</button>

</nav>



<main>


<!-- =====================
     DICTIONARY
====================== -->

<section id="dictionaryPage">

<div
    id="count"
    class="count"
>
Loading dictionary...
</div>

<div id="results"></div>

</section>



<!-- =====================
     RANDOM
====================== -->

<section
    id="randomPage"
    class="hidden"
>

<div class="randomCard">

<div id="randomResult"></div>

<br>

<button
    type="button"
    onclick="randomWord()"
>
Another word
</button>

</div>

</section>



<!-- =====================
     ALPHABET
====================== -->

<section
    id="alphabetPage"
    class="hidden"
>

<div
    id="alphabet"
    class="alphabet"
></div>

<div id="alphabetResults"></div>

</section>



<!-- =====================
     ABOUT
====================== -->

<section
    id="aboutPage"
    class="hidden"
>

<div class="card">

<h2>
About
</h2>

<p>
samin Dictionary
</p>

<p>
This dictionary uses the samin vocabulary
from <code>co_a.txt</code>.
</p>

<p>
The vocabulary includes word classes,
derivations, grammatical markers,
and English definitions.
</p>

<p>
Vocabulary source:
</p>

<a
    href="https://raw.githubusercontent.com/Fhres126/w/main/co_a.txt"
    target="_blank"
    rel="noopener"
>
co_a.txt
</a>

</div>

</section>


</main>



<script>


/* =====================================================
   SOURCE
===================================================== */

const SOURCE =
"https://raw.githubusercontent.com/Fhres126/w/main/co_a.txt";


let entries = [];

let currentSearchMode = "auto";



/* =====================================================
   LOAD DICTIONARY
===================================================== */

loadDictionary();


async function loadDictionary(){

    try{

        const response =
            await fetch(SOURCE);


        if(!response.ok){

            throw new Error(
                "Could not load co_a.txt."
            );

        }


        const text =
            await response.text();


        entries =
            parseDictionary(text);


        document
            .getElementById("count")
            .textContent =
            entries.length +
            " entries";


        render(
            entries.slice(0,100)
        );


        createAlphabet();

    }

    catch(error){

        document
            .getElementById("count")
            .textContent =
            "Dictionary loading failed.";


        document
            .getElementById("results")
            .innerHTML =
            '<div class="empty">' +
            escapeHTML(error.message) +
            '</div>';

    }

}



/* =====================================================
   PARSER FOR co_a.txt
===================================================== */

function parseDictionary(text){

    const result = [];

    let currentCategory = "";


    const lines =
        text.split(/\r?\n/);


    for(
        let raw of lines
    ){

        const line =
            raw.trim();


        if(!line)
            continue;


        /* ---------------------------------------------
           Category headers
        --------------------------------------------- */

        const categoryMatch =
            line.match(
                /^▶\s*([A-Za-z])\s*\{/
            );


        if(categoryMatch){

            currentCategory =
                categoryMatch[1].toUpperCase();

            continue;

        }


        if(
            /^}◀/.test(line) ||
            /^}\s*◀/.test(line)
        ){

            continue;

        }


        /* ---------------------------------------------
           Ignore comments / explanatory lines
        --------------------------------------------- */

        if(
            line.startsWith("//") ||
            line.startsWith("▶") ||
            line.startsWith("◀")
        )
            continue;


        /* ---------------------------------------------
           Dictionary entries require "="
        --------------------------------------------- */

        if(!line.includes("="))
            continue;


        const equal =
            line.indexOf("=");


        let left =
            line
            .substring(0,equal)
            .trim();


        let right =
            line
            .substring(equal + 1)
            .trim();


        /* 계층 기호(-) 제거 */

        left =
            left
            .replace(/^-+/, "")
            .trim();


        if(!left)
            continue;


        /* ---------------------------------------------
           [= 이전의 마지막 공백 기준 파싱 로직]
           - '=' 직전의 마지막 공백을 찾아 태그 특수문자(!, _, (, ,)가
             포함되어 있으면 태그로 분리하고, 없으면 전체를 단어로 인식합니다.
        --------------------------------------------- */

        let word = left;
        let grammar = "";

        const lastSpaceIndex = left.lastIndexOf(" ");

        if (lastSpaceIndex !== -1) {

            const possibleTag = left.substring(lastSpaceIndex + 1).trim();

            if (/[!_\(,]/.test(possibleTag)) {

                word = left.substring(0, lastSpaceIndex).trim();

                grammar = possibleTag;

            } else {

                word = left.trim();

                grammar = "";

            }

        } else {

            word = left.trim();

            grammar = "";

        }


        if(!word)
            continue;


        /* ---------------------------------------------
           English meaning (= 뒤부터 첫번째 . 전까지) & comments (. 이후)
        --------------------------------------------- */

        let mainMeaning = right;
        let comment = "";

        if (right.includes(".")) {

            const idx = right.indexOf(".");

            mainMeaning = right.substring(0, idx).trim();

            comment = right.substring(idx + 1).trim();

        }


        let displayMeaning =
            mainMeaning
            .replace(/\s+/g," ")
            .trim();


        if(!displayMeaning)
            continue;


        /* ---------------------------------------------
           Clean Raw Source Display
        --------------------------------------------- */

        let displayRaw = raw
            .replace(/\t/g, "")
            .replace(/^-+/, "")
            .trim()
            .replace(/\s+/g, " ");


        result.push({

            word:word,

            meaning:displayMeaning,

            comment:comment,

            grammar:grammar,

            category:currentCategory,

            raw:displayRaw

        });

    }


    /* ---------------------------------------------
       Remove exact duplicates
    --------------------------------------------- */

    const seen =
        new Set();


    return result.filter(
        function(item){

            const key =
                item.raw;


            if(seen.has(key))
                return false;


            seen.add(key);

            return true;

        }
    );

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)
    .replace(
        /[&<>"']/g,

        function(char){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            };

            return map[char];

        }
    );

}



/* =====================================================
   RENDER
===================================================== */

function render(
    list,
    target="results"
){

    const element =
        document.getElementById(target);


    if(!list.length){

        element.innerHTML =
            '<div class="empty">' +
            'No result.' +
            '</div>';

        return;

    }


    let html = "";


    let lastCategory = "";


    for(
        const item of list
    ){

        if(
            target === "results" &&
            item.category &&
            item.category !== lastCategory
        ){

            html += `

                <div class="category">
                    ${escapeHTML(item.category)}
                </div>

            `;


            lastCategory =
                item.category;

        }


        html += `

            <article class="entry">

                <div class="entryWord">

                    <div class="word">
                        ${escapeHTML(item.word)}
                    </div>

                    ${
                        item.grammar
                        ?
                        `
                        <div class="type">
                            ${escapeHTML(item.grammar)}
                        </div>
                        `
                        :
                        ""
                    }

                </div>


                <div class="meaning">
                    ${escapeHTML(item.meaning)}
                </div>

                ${
                    item.comment
                    ?
                    `
                    <div class="comment">
                        ${escapeHTML(item.comment)}
                    </div>
                    `
                    :
                    ""
                }


                <div class="source">
                    ${escapeHTML(item.raw)}
                </div>

            </article>

        `;

    }


    element.innerHTML =
        html;

}



/* =====================================================
   REAL-TIME SEARCH
===================================================== */

function setSearchMode(mode, el){

    currentSearchMode = mode;


    document.querySelectorAll('.modeBtn').forEach(function(btn){

        btn.classList.remove('active');

    });


    el.classList.add('active');


    performSearch();

}


function getSearchScore(item, query, mode) {

    const word = item.word.toLowerCase();
    const meaning = item.meaning.toLowerCase();

    const wordBoundaryRegex = new RegExp(`\\b${query}\\b`, 'i');


    if (mode === "samin") {

        if (word === query) return 100;

        if (word.startsWith(query)) return 80;

        if (wordBoundaryRegex.test(word)) return 60;

        if (word.includes(query)) return 20;

        return 0;

    }

    if (mode === "english") {

        if (meaning === query) return 100;

        if (meaning.startsWith(query)) return 80;

        if (wordBoundaryRegex.test(meaning)) return 60;

        if (meaning.includes(query)) return 30;

        return 0;

    }

    // Auto Mode
    if (word === query) return 100;

    if (meaning === query) return 95;

    if (word.startsWith(query)) return 85;

    if (meaning.startsWith(query)) return 75;

    if (wordBoundaryRegex.test(meaning)) return 65;

    if (wordBoundaryRegex.test(word)) return 60;

    if (meaning.includes(query)) return 30;

    if (word.includes(query)) return 20;

    return 0;

}


function performSearch(){

    const query =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    showPage("dictionary");


    if(!query){

        document
        .getElementById("count")
        .textContent =
        entries.length +
        " entries";


        render(
            entries.slice(0,100)
        );

        return;

    }


    const scored = [];


    for (const item of entries) {

        const score = getSearchScore(item, query, currentSearchMode);

        if (score > 0) {

            scored.push({ item: item, score: score });

        }

    }


    scored.sort((a, b) => b.score - a.score);


    const result = scored.map(s => s.item);


    document
    .getElementById("count")
    .textContent =
        result.length +
        " result" +
        (
            result.length === 1
            ? ""
            : "s"
        );


    render(result);

}



/* =====================================================
   RANDOM
===================================================== */

function randomWord(){

    if(!entries.length)
        return;


    const item =
        entries[
            Math.floor(
                Math.random() *
                entries.length
            )
        ];


    const element =
        document
        .getElementById("randomResult");


    element.innerHTML = `

        <div class="word">
            ${escapeHTML(item.word)}
        </div>

        ${
            item.grammar
            ?
            `
            <div class="type"
                 style="display:inline-block;margin-top:8px">
                ${escapeHTML(item.grammar)}
            </div>
            `
            :
            ""
        }

        <div class="randomMeaning">
            ${escapeHTML(item.meaning)}
        </div>

        ${
            item.comment
            ?
            `
            <div class="comment">
                ${escapeHTML(item.comment)}
            </div>
            `
            :
            ""
        }

        <div class="source">
            ${escapeHTML(item.raw)}
        </div>

    `;

}



/* =====================================================
   ALPHABET
===================================================== */

function createAlphabet(){

    const letters =
        "abcdefghijklmnopqrstuvwxyz"
        .split("");


    document
    .getElementById("alphabet")
    .innerHTML =

        letters
        .map(
            function(letter){

                return `

                    <button
                        type="button"
                        onclick="alphabetSearch('${letter}')"
                    >
                        ${letter}
                    </button>

                `;

            }
        )
        .join("");

}


function alphabetSearch(letter){

    const result =
        entries.filter(
            function(item){

                return item.word
                    .toLowerCase()
                    .startsWith(letter);

            }
        );


    render(
        result,
        "alphabetResults"
    );

}



/* =====================================================
   PAGE NAVIGATION
===================================================== */

showPage('dictionary');

function showPage(page){

    document
        .getElementById("dictionaryPage")
        .classList
        .toggle(
            "hidden",
            page !== "dictionary"
        );


    document
        .getElementById("randomPage")
        .classList
        .toggle(
            "hidden",
            page !== "random"
        );


    document
        .getElementById("alphabetPage")
        .classList
        .toggle(
            "hidden",
            page !== "alphabet"
        );


    document
        .getElementById("aboutPage")
        .classList
        .toggle(
            "hidden",
            page !== "about"
        );


    if(page === "random"){

        randomWord();

    }

}



/* =====================================================
   INPUT EVENT & VISUAL VIEWPORT FIX
===================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        performSearch
    );


/* 키보드가 열려 있는 상태에서도 높이를 실시간 계산하여 하단 여백 제거 */
function updateViewportHeight() {
    if (window.visualViewport) {
        document.body.style.height = window.visualViewport.height + 'px';
    }
}

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateViewportHeight);
    window.visualViewport.addEventListener('scroll', updateViewportHeight);
}

</script>

</body>

</html>
